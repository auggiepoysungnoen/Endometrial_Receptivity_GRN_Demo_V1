<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASTRAEA</title>
  <meta name="description" content="ASTRAEA: an interactive atlas of the gene regulatory network of the human endometrium. Hickey Lab, Duke University.">
  <link rel="icon" type="image/svg+xml" href="assets/astraea-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="hero">
    <svg class="logo" viewBox="0 0 1250 260" role="img" aria-label="ASTRAEA">
  <defs><linearGradient id="inkback" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7ff0" stop-opacity=".25"/><stop offset=".5" stop-color="#c792ea" stop-opacity=".55"/><stop offset="1" stop-color="#e87ba4" stop-opacity=".3"/></linearGradient>
    <linearGradient id="inkfront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a98cf0"/><stop offset=".38" stop-color="#e87ba4"/><stop offset=".72" stop-color="#f7d7a2"/><stop offset="1" stop-color="#c792ea" stop-opacity=".55"/></linearGradient>
    <radialGradient id="inkglow"><stop offset="0" stop-color="#f7d7c9" stop-opacity=".45"/><stop offset="1" stop-color="#f7d7c9" stop-opacity="0"/></radialGradient>
    <linearGradient id="inkword" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ddd3"/><stop offset=".5" stop-color="#e0b2a4"/><stop offset="1" stop-color="#c17f70"/></linearGradient></defs>
  <g transform="translate(132 130)">
    <g transform="rotate(-22)">
      <path d="M -108 0 A 108 39 0 0 1 108 0" fill="none" stroke="url(#inkback)" stroke-width="8.6" stroke-linecap="round"/>
    </g>
    <circle r="36" fill="url(#inkglow)"/>
    <path d="M0 0 L0.0 -72.0 L8.9 -13.3 Z" fill="#cdbab0"/>
    <path d="M0 0 L8.9 -13.3 L55.6 -22.5 Z" fill="#6b4a3d"/>
    <path d="M0 0 L55.6 -22.5 L13.3 8.9 Z" fill="#6b4a3d"/>
    <path d="M0 0 L13.3 8.9 L0.0 72.0 Z" fill="#6b4a3d"/>
    <path d="M0 0 L0.0 72.0 L-8.9 13.3 Z" fill="#6b4a3d"/>
    <path d="M0 0 L-8.9 13.3 L-55.6 22.5 Z" fill="#715144"/>
    <path d="M0 0 L-55.6 22.5 L-13.3 -8.9 Z" fill="#94796d"/>
    <path d="M0 0 L-13.3 -8.9 L0.0 -72.0 Z" fill="#e9d9d1"/>
    <g transform="rotate(-22)">
      <path d="M 108 0 A 108 39 0 0 1 -108 0" fill="none" stroke="url(#inkfront)" stroke-width="12" stroke-linecap="round"/>
      <path d="M 59 30 A 108 39 0 0 1 -22 39" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
  <path d="M292 130 Q 298 121 314 118 Q 298 115 292 106 Q 286 115 270 118 Q 286 121 292 130 Z" fill="url(#inkword)" opacity="0.8"/>
  <text x="362" y="167" font-family="Cinzel, 'Times New Roman', serif" font-size="110" letter-spacing="38" fill="url(#inkword)">ASTRAEA</text>
  <path d="M1204 130 Q 1210 121 1226 118 Q 1210 115 1204 106 Q 1198 115 1182 118 Q 1198 121 1204 130 Z" fill="url(#inkword)" opacity="0.8"/>
</svg>

    <nav class="entries" aria-label="Open the atlas">
      <a href="atlas.html?ui=desktop" data-ui="desktop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="1.6"/><path d="M9 20.5h6M12 17.5v3"/></svg>
        <span>Desktop</span>
      </a>
      <a href="atlas.html?ui=tablet" data-ui="tablet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="1.8"/><path d="M11 19h2"/></svg>
        <span>iPad</span>
      </a>
      <a href="atlas.html?ui=phone" data-ui="phone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="2.5" width="9" height="19" rx="2"/><path d="M11 19h2"/></svg>
        <span>Mobile</span>
      </a>
    </nav>
  </main>

  <script>
    // Faint starfield; static when the visitor prefers reduced motion.
    (function () {
      const c = document.getElementById("stars"), x = c.getContext("2d");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let stars = [], w = 0, h = 0, raf = null;
      function seed() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = c.width = Math.round(innerWidth * dpr); h = c.height = Math.round(innerHeight * dpr);
        c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
        const n = Math.min(200, Math.round((innerWidth * innerHeight) / 10000));
        stars = Array.from({ length: n }, () => ({
          x: Math.random() * w, y: Math.random() * h, r: (Math.random() * 1.05 + 0.3) * dpr,
          a: Math.random() * 0.45 + 0.15, t: Math.random() * 6.28, s: Math.random() * 0.6 + 0.2,
        }));
      }
      function draw(now) {
        x.clearRect(0, 0, w, h);
        x.fillStyle = "#e9d6cf";
        for (const st of stars) {
          x.globalAlpha = still ? st.a : st.a * (0.6 + 0.4 * Math.sin(st.t + now / 1000 * st.s));
          x.beginPath(); x.arc(st.x, st.y, st.r, 0, 6.2832); x.fill();
        }
        x.globalAlpha = 1;
        if (!still) raf = requestAnimationFrame(draw);
      }
      function start() { if (raf) cancelAnimationFrame(raf); seed(); draw(performance.now()); }
      addEventListener("resize", start);
      start();
    })();

    // Mark the entry that fits the current screen; no text needed.
    (function () {
      const w = innerWidth;
      const guess = w < 700 ? "phone" : w < 1180 ? "tablet" : "desktop";
      document.querySelector(`.entries a[data-ui="${guess}"]`)?.classList.add("suggested");
    })();
  </script>
</body>
</html>
